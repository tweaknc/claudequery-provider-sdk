   16-bit pass: every material is a three-step ramp (light / base / dark)

   makeSprite reads each silhouette and shades it, so the art data stays
   readable while the output picks up a bevel and a hard outline.
   ---------------------------------------------------------------------- */

  o:['#ffeaa8','#f8d878','#c89820'],   y:['#f0c860','#d8a028','#8c6410'],
  s:['#ffdcb4','#fcc088','#c07840'],   S:['#e8a468','#c87840','#8c4c20'],

  w:['#ffffff','#fcfcfc','#c0c8dc'],   W:['#e8eef8','#d0d8e8','#98a2ba'],
  g:['#70e048','#40a828','#1c6410'],   G:['#34901f','#1c6410','#0c3808'],
  n:['#c88a52','#a06030','#5c3010'],   N:['#8c4c24','#5c3010','#301808'],
  c:['#a8e0ff','#68c0f8','#2470b8'],   C:['#3c88d0','#1c60a8','#0c3468'],
  t:['#ffee90','#f8d000','#b08000'],   T:['#e0aa20','#b08000','#6c4c00'],
  m:['#e0e4f0','#a8a8a8','#6c6c74'],   M:['#8c8c94','#585858','#303038'],
  d:['#5c6470','#3c4048','#1c2028'],   K:['#3c3c44','#202020','#0a0a0c'],
  e:['#ffffff','#f0f0f8','#b8bcc8'],   E:['#a06430','#7c4818','#442408'],
  a:['#fff0c8','#e0cfa0','#a08858'],   A:['#d0b884','#b09868','#705838']
};
const PAL = {
  k:'#000000', K:'#202020', m:'#a8a8a8', M:'#585858', w:'#fcfcfc', W:'#d0d8e8',
  o:'#f8d878', y:'#d8a028', s:'#fcc088', S:'#c87840', p:'#f88898',
  b:'#2c3c88', B:'#141c48', r:'#d82800', R:'#8c1000',
  g:'#40a828', G:'#1c6410', n:'#a06030', N:'#5c3010',
  c:'#68c0f8', C:'#1c60a8', t:'#f8d000', T:'#b08000',
  d:'#3c4048', e:'#f0f0f8', E:'#7c4818', a:'#e0cfa0', A:'#b09868'
};

// Sprites are padded 1px so the outline has somewhere to live; drawSpr backs
// the offset out again, so every call site keeps its original coordinates.
function makeSprite(rows){
  const h = rows.length, w = rows[0].length;
  for (const r of rows) if (r.length !== w) throw new Error('sprite row width mismatch: '+r);
  const at = (x,y) => (y<0||y>=h||x<0||x>=w) ? '.' : rows[y][x];

  const cv = document.createElement('canvas');
  cv.width = w+2; cv.height = h+2;
  const x2 = cv.getContext('2d');

  // 1. hard black outline in the padding ring and any transparent gap
  x2.fillStyle = '#000000';
  for (let y=-1;y<=h;y++) for (let x=-1;x<=w;x++){
    if (at(x,y) !== '.') continue;
    if (at(x,y-1) !== '.' || at(x,y+1) !== '.' || at(x-1,y) !== '.' || at(x+1,y) !== '.')
      x2.fillRect(x+1, y+1, 1, 1);
  }
  // 2. shade each material by where the pixel sits in its own region
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const ch = rows[y][x];
    if (ch === '.') continue;
    const ramp = RAMP[ch];
    let col = PAL[ch] || '#ff00ff';
    if (ramp){
      if      (at(x,y-1) !== ch) col = ramp[0];   // lit top edge
      else if (at(x,y+1) !== ch) col = ramp[2];   // shaded underside
      else if (at(x-1,y) !== ch) col = ramp[0];   // key light from the left
      else if (at(x+1,y) !== ch) col = ramp[2];
      else                       col = ramp[1];
    }
    x2.fillStyle = col;
    x2.fillRect(x+1, y+1, 1, 1);
  }
  cv.ox = 1; cv.oy = 1;
  return cv;
}
function drawSpr(s, x, y, flip){
  x = Math.round(x) - (s.ox || 0); y = Math.round(y) - (s.oy || 0);
  if (flip){ g.save(); g.translate(x + s.width, y); g.scale(-1,1); g.drawImage(s,0,0); g.restore(); }
  else g.drawImage(s, x, y);
}

/* ------------------------------- input --------------------------------- */
const keys = Object.create(null);
const pressed = Object.create(null);          // consumed once per press
let typingBuffer = null;                      // non-null while entering a custom name

const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  Space:'jump', KeyZ:'jump', KeyX:'act', KeyJ:'act',
  Enter:'start', NumpadEnter:'start', Escape:'back'
};
function keyDown(code){
  const a = KEYMAP[code]; if (!a) return;
  if (!keys[a]) pressed[a] = true;
  keys[a] = true;
}
function keyUp(code){ const a = KEYMAP[code]; if (a) keys[a] = false; }
function tap(action){ return !!pressed[action]; }
function clearPressed(){ for (const k in pressed) pressed[k] = false; }

addEventListener('keydown', e => {
  if (typingBuffer !== null && handleTyping(e)) { e.preventDefault(); return; }
  if (e.code === 'KeyM'){ audio.toggle(); return; }
  if (e.code === 'KeyP' && game.state === 'play'){ game.paused = !game.paused; return; }
  if (KEYMAP[e.code]) e.preventDefault();
  keyDown(e.code);
  audio.unlock();
});
addEventListener('keyup', e => keyUp(e.code));
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// Touch pad
if (matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');
for (const btn of document.querySelectorAll('#pad button')){
  const code = btn.dataset.k;
  const on  = e => { e.preventDefault(); audio.unlock(); keyDown(code); keyDown('Enter'); };
  const off = e => { e.preventDefault(); keyUp(code); keyUp('Enter'); };
  btn.addEventListener('touchstart', on, {passive:false});
  btn.addEventListener('touchend', off, {passive:false});
  btn.addEventListener('touchcancel', off, {passive:false});
  btn.addEventListener('mousedown', on);
  btn.addEventListener('mouseup', off);
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); audio.unlock(); keyDown('Enter'); });

/* -------------------------------- audio -------------------------------- */
const audio = {
  ctx:null, on:true, master:null, step:0, timer:null, track:null,
  unlock(){
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.on ? 0.5 : 0;
    this.master.connect(this.ctx.destination);
  },
  toggle(){ this.on = !this.on; if (this.master) this.master.gain.value = this.on ? 0.5 : 0; },
  blip(freq, dur, type, vol){
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), a = this.ctx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    a.gain.setValueAtTime(0, t);
    a.gain.linearRampToValueAtTime(vol == null ? 0.14 : vol, t + 0.006);
    a.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(a); a.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  sweep(f1, f2, dur, type, vol){
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), a = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t + dur);
    a.gain.setValueAtTime(vol == null ? 0.12 : vol, t);
    a.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(a); a.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol){
    if (!this.ctx || !this.on) return;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const a = this.ctx.createGain(); a.gain.value = vol == null ? 0.16 : vol;
    src.connect(a); a.connect(this.master); src.start();
  },
  // --- one-shots -------------------------------------------------------
  sfx(name){
    switch(name){
      case 'jump':    this.sweep(300, 620, 0.13, 'square', 0.10); break;
      case 'swing':   this.sweep(900, 240, 0.10, 'sawtooth', 0.09); break;
      case 'coin':    this.blip(1046,0.06); setTimeout(()=>this.blip(1568,0.09),55); break;
      case 'bonk':    this.noise(0.10,0.14); this.sweep(500,120,0.16,'square',0.10); break;
      case 'hurt':    this.sweep(320, 70, 0.35, 'sawtooth', 0.13); break;
      case 'shoot':   this.sweep(760, 380, 0.07, 'square', 0.07); break;
      case 'eagle':   this.blip(1318,0.07); setTimeout(()=>this.blip(1760,0.07),60);
                      setTimeout(()=>this.blip(2093,0.14),120); break;
      case 'menu':    this.blip(660, 0.05, 'square', 0.09); break;
      case 'stamp':   this.noise(0.18,0.22); this.sweep(180,60,0.3,'square',0.14); break;
      case 'clear':   [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.blip(f,0.16),i*110)); break;
      case 'over':    [392,349,311,262].forEach((f,i)=>setTimeout(()=>this.blip(f,0.30,'triangle'),i*170)); break;
    }
  },
  // --- looping chiptune ------------------------------------------------
  music(track){
    if (this.track === track) return;
    this.track = track;
    clearInterval(this.timer); this.timer = null; this.step = 0;
    if (!track) return;
    const seq = TRACKS[track];
    this.timer = setInterval(() => {
      if (!this.ctx || !this.on || game.paused) return;
      const i = this.step % seq.lead.length;
      const lead = seq.lead[i], bass = seq.bass[i % seq.bass.length];
      if (lead) this.blip(lead, seq.gate, 'square', 0.055);
      if (bass) this.blip(bass, seq.gate * 1.6, 'triangle', 0.075);
      if (seq.drum && this.step % 4 === 0) this.noise(0.05, 0.05);
      this.step++;
    }, seq.ms);
  }
};

    bass:[N(50),N(50),N(57),N(50),N(51),N(51),N(58),N(51)] },
  secret:{ ms:118, gate:0.10, drum:true,
    lead:[N(64),N(67),N(71),N(74),N(71),N(67),N(64),N(67),N(62),N(65),N(69),N(72),N(69),N(65),N(62),0],
    bass:[N(40),N(40),N(47),N(40),N(38),N(38),N(45),N(38)] },
  hail:  { ms:170, gate:0.16, drum:false,
    lead:[N(72),N(72),N(79),N(79),N(81),N(81),N(79),0,N(77),N(77),N(76),N(76),N(74),N(74),N(72),0],
    bass:[N(48),0,N(55),0,N(53),0,N(55),0] }
};

/* ------------------------------- helpers -------------------------------- */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rnd   = (a,b) => a + Math.random() * (b - a);
const hit   = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

function text(str, x, y, color, align, size){
  g.font = 'bold ' + (size || 8) + 'px "Courier New", monospace';
  g.textAlign = align || 'left';
  g.textBaseline = 'top';
  g.fillStyle = '#000';
  g.fillText(str, x + 1, y + 1);
  g.fillStyle = color || '#fcfcfc';
  g.fillText(str, x, y);
  g.textAlign = 'left';
}
// 16-bit skies dither between stops rather than using a smooth gradient.
// A 4x4 Bayer matrix keeps the pattern even in both axes -- a density check
// on x alone produces vertical banding. Rendered once per theme and cached,
// since a per-pixel pass every frame is far too slow.
const BAYER4 = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
const _skyCache = {};
const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
function ditherSky(key, stops, top, bottom){
  let cvs = _skyCache[key];
  if (!cvs){
    cvs = document.createElement('canvas'); cvs.width = W; cvs.height = H;
    const cx = cvs.getContext('2d');
    const img = cx.createImageData(W, H), d = img.data;
    const rgb = stops.map(st => [st[0], hex2rgb(st[1])]);
    for (let y=0; y<H; y++){
      const t = clamp((y - top) / (bottom - top), 0, 1);
      let i = 0; while (i < rgb.length-2 && t > rgb[i+1][0]) i++;
      const [t0,c0] = rgb[i], [t1,c1] = rgb[i+1];
      const fr = clamp((t - t0) / ((t1 - t0) || 1), 0, 1);
      for (let x=0; x<W; x++){
        const c = fr > (BAYER4[((y&3)<<2) | (x&3)] + 0.5) / 16 ? c1 : c0;
        const o = (y*W + x) * 4;
        d[o] = c[0]; d[o+1] = c[1]; d[o+2] = c[2]; d[o+3] = 255;
      }
    }
    cx.putImageData(img, 0, 0);
    _skyCache[key] = cvs;
  }
  g.drawImage(cvs, 0, 0);
}
// Distance fog: wash a parallax layer toward the sky colour.
function haze(color, alpha, y0, y1){
  g.globalAlpha = alpha; g.fillStyle = color;
  g.fillRect(0, y0, W, y1 - y0); g.globalAlpha = 1;
}
function bevelBox(x,y,w,h,fill,light,dark){
  g.fillStyle = fill; g.fillRect(x,y,w,h);
  g.fillStyle = light; g.fillRect(x,y,w,1); g.fillRect(x,y,1,h);
  g.fillStyle = dark;  g.fillRect(x,y+h-1,w,1); g.fillRect(x+w-1,y,1,h);
}
function box(x,y,w,h,fill,border){
  g.fillStyle = fill; g.fillRect(x,y,w,h);
  if (border){ g.strokeStyle = border; g.lineWidth = 1; g.strokeRect(x+0.5,y+0.5,w-1,h-1); }
}

/* ------------------------------ particles ------------------------------- */
const parts = [];
function burst(x, y, color, count, spread, life){
  for (let i=0;i<(count||8);i++)
    parts.push({ x, y, vx: rnd(-1,1)*(spread||1.6), vy: rnd(-2.2,0.4),
                 life: life||26, max: life||26, c: color || '#fcfcfc' });
}
function popText(x, y, str, color){
  parts.push({ x, y, vx:0, vy:-0.45, life:46, max:46, c: color || '#f8d000', txt: str });
}
function updateParts(){
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.x += p.vx; p.y += p.vy;
    if (!p.txt) p.vy += 0.12;
    if (--p.life <= 0) parts.splice(i,1);
  }
}
function drawParts(camX){
  for (const p of parts){
    const x = p.x - camX, a = p.life / p.max;
    if (p.txt){ g.globalAlpha = a < 0.4 ? a/0.4 : 1; text(p.txt, x, p.y, p.c, 'center'); g.globalAlpha = 1; }
    else {
      g.globalCompositeOperation = 'lighter';
      g.globalAlpha = a * 0.30; g.fillStyle = p.c;
      g.fillRect(Math.round(x)-2, Math.round(p.y)-2, 6, 6);
      g.globalCompositeOperation = 'source-over';
      g.globalAlpha = a; g.fillRect(Math.round(x), Math.round(p.y), 2, 2);
      g.globalAlpha = 1;
    }
  }
}

/* ========================================================================

const GRAV = 0.42, MAXFALL = 6.4, ACC = 0.5, FRIC = 0.74, MAXVX = 2.35, JUMPV = -7.0;

function addBall(x, y){ world.coins.push({ x, y, w:6, h:6, got:false }); }

    const plats = [[260,140],[372,112],[484,140],[860,132],[972,104],[1084,136],

    for (let x=2500; x<2700; x+=48) addBall(x, 160);
    world.enemies.push(mkEnemy('moose',   520, 164, 380, 680));

    world.enemies.push(mkEnemy('hockey', 1500, 162));
    world.enemies.push(mkEnemy('moose',  1800, 164, 1400, 1880));
    world.enemies.push(mkEnemy('hockey', 2100, 162));
    world.enemies.push(mkEnemy('moose',  2300, 164, 1990, 2380));

function mkEnemy(type, x, y, a, b){
  const base = { type, x, y, vx:0, vy:0, w:12, h:12, face:-1, t:0, hp:1,
                 dizzy:0, gone:false, a, b, anim:0 };
  if (type === 'goose')  return Object.assign(base, { w:14, h:14, vx:-0.55, y:y });
  if (type === 'hockey') return Object.assign(base, { w:14, h:22, cool:70 });
  if (type === 'moose')  return Object.assign(base, { w:26, h:20, vx:-0.7, hp:2 });
  return base;
}

/* ------------------------------ collision -------------------------------- */
function solidAt(box){
  for (const s of world.solids) if (hit(box, s)) return s;
  return null;
}
function movePlayer(){
  // horizontal
  P.x += P.vx;
  let s = solidAt(P);
  if (s){
    P.x = P.vx > 0 ? s.x - P.w : s.x + s.w;
    P.vx = 0;
  }
  // vertical
  P.y += P.vy;
  P.onGround = false;
  s = solidAt(P);
  if (s){
    if (P.vy > 0){ P.y = s.y - P.h; P.onGround = true; }
    else { P.y = s.y + s.h; }
    P.vy = 0;
  }
  P.x = clamp(P.x, 0, world.len - P.w);
}

function hurtPlayer(knock){
  if (P.inv > 0) return;
  game.hearts--; P.inv = 100; game.shake = 10; game.flash = 6;
  P.vy = -3.6; P.vx = (knock || -P.face) * 2.6;
  audio.sfx('hurt');
  burst(P.x + 5, P.y + 10, '#d82800', 12, 2);
  if (game.hearts <= 0) loseGame();
}
function loseGame(){
  game.state = 'gameover'; game.msg = null;
  game.goLine = Math.floor(Math.random() * GO_LINES.length);
  audio.music(null); audio.sfx('over');
}

/* ------------------------------ swing hitbox ------------------------------ */
function swingBox(){
  if (P.swing < 4 || P.swing > 13) return null;
  return { x: P.face > 0 ? P.x + P.w - 2 : P.x - 16, y: P.y + 2, w: 18, h: 18 };
}

/* ------------------------------ update ----------------------------------- */
function updatePlatformer(){
  const t = game.tick;

  /* ---- input ---- */
  if (!P.dead){
    if (keys.left)  { P.vx -= ACC; P.face = -1; }
    if (keys.right) { P.vx += ACC; P.face =  1; }
    if (!keys.left && !keys.right) P.vx *= FRIC;
    P.vx = clamp(P.vx, -MAXVX, MAXVX);

    if (tap('jump')) P.jumpBuf = 8;
    if (P.jumpBuf > 0) P.jumpBuf--;
    if (P.onGround) P.coyote = 7; else if (P.coyote > 0) P.coyote--;
    if (P.jumpBuf > 0 && P.coyote > 0){
      P.vy = JUMPV; P.jumpBuf = 0; P.coyote = 0; P.onGround = false; P.squash = 1;
      audio.sfx('jump'); burst(P.x+5, P.y+P.h, '#ffffff', 5, 0.9, 14);
    }
    if (P.vy < 0 && !keys.jump) P.vy *= 0.86;      // variable jump height

    if (tap('act') && P.swing === 0){ P.swing = 18; audio.sfx('swing'); }
  }
  if (P.swing > 0) P.swing--;
  if (P.inv > 0) P.inv--;

  P.vy = Math.min(P.vy + GRAV, MAXFALL);
  const fell = P.vy, wasAir = !P.onGround;
  movePlayer();
  if (wasAir && P.onGround && fell > 3){          // landed hard: flatten and kick dust
    P.squash = -Math.min(1, fell / 6);
    burst(P.x + 5, P.y + P.h, world.theme === 'north' ? '#ffffff' : '#d8c890',
          6, 1.5, 16);
  }
  P.squash *= 0.82;
  if (Math.abs(P.squash) < 0.02) P.squash = 0;
  P.anim = Math.abs(P.vx) > 0.25 ? P.anim + Math.abs(P.vx) * 0.18 : 0;

  /* ---- pits / hazards ---- */
  if (P.y > H + 60){
    P.x = Math.max(0, P.x - 70); P.y = 60; P.vx = 0; P.vy = 0;
    hurtPlayer(0);
    if (game.hearts > 0) say(world.theme === 'golf' ? 'INTO THE DRINK!' : 'THIN ICE!', 80);
  }
  for (const hz of world.hazards){
    if (hit(P, hz) && P.inv <= 0){ hurtPlayer(-P.face); }
  }

  /* ---- coins ---- */
  for (const c of world.coins){
    if (c.got) continue;
    if (hit(P, c)){
      c.got = true; game.score += 100;
      audio.sfx('coin'); burst(c.x+3, c.y+3, '#fcfcfc', 6, 1.3, 18);
    }
  }

  if (world.secret && !world.secret.taken && hit(P, world.secret)){ warpToSecret(); return; }

  const sw = swingBox();

  /* ---- enemies ---- */
  for (const e of world.enemies) updateEnemy(e, sw);

  /* ---- projectiles ---- */
  for (let i=world.shots.length-1;i>=0;i--){
    const s = world.shots[i];
    s.x += s.vx; s.y += s.vy; s.vy += s.grav || 0;
    if (sw && hit(s, sw)){                        // golf-swing a puck back
      s.vx = Math.abs(s.vx) * P.face * 1.9; s.friendly = true;
      audio.sfx('bonk'); popText(s.x, s.y-10, 'FORE!', '#f8d000');
      game.score += 50;
    }
    if (!s.friendly && hit(s, P)) { hurtPlayer(Math.sign(s.vx)); world.shots.splice(i,1); continue; }
    if (s.x < -20 || s.x > world.len + 20 || s.y > H + 40) world.shots.splice(i,1);
  }

  /* ---- bosses ---- */
  if (world.boss) updateBoss(sw);
  if (world.biden) updateBiden(sw);

  /* ---- goal ---- */
  if (!world.done && !world.boss && P.x + P.w > world.goal){ clearLevel(); }
  if (!world.done && world.boss && world.boss.dead && P.x + P.w > world.goal){ clearLevel(); }

  updateParts();
}

function clearLevel(){
  world.done = true;
  game.state = 'levelclear';
  audio.music(null); audio.sfx('clear');
}

function updateEnemy(e, sw){
  if (e.gone) return;
  e.t++; e.anim += 0.12;

  if (e.dizzy > 0){                       // bonked: spin off screen, no gore, just comedy
    e.dizzy--; e.y -= 1.4; e.x += e.face * 0.9;
    if (e.dizzy <= 0) e.gone = true;
    return;
  }

  switch(e.type){
    case 'goose':
      e.x += e.vx;
      if (e.x < e.a || e.x + e.w > e.b) e.vx *= -1;
      e.face = e.vx < 0 ? -1 : 1;
      e.x = clamp(e.x, e.a, e.b - e.w);
      e.y = 170 + Math.sin(e.t * 0.06) * 6;
      break;
    case 'hockey':
      e.face = P.x < e.x ? -1 : 1;
      if (--e.cool <= 0 && Math.abs(P.x - e.x) < 150){
        e.cool = 95;
        world.shots.push({ x:e.x + (e.face<0?-4:e.w), y:e.y+16, w:5, h:4,
                           vx: e.face * 2.5, vy:0, grav:0, kind:'puck' });
      }
      break;
    case 'moose': {
      const near = Math.abs(P.x - e.x) < 120 && Math.abs(P.y - e.y) < 50;
      const spd = near ? 1.9 : 0.7;
      e.x += Math.sign(e.vx) * spd;
      if (e.x < e.a || e.x + e.w > e.b) e.vx *= -1;
      if (near) e.vx = Math.sign(P.x - e.x) || e.vx;
      e.x = clamp(e.x, e.a, e.b - e.w);
      e.face = e.vx < 0 ? -1 : 1;
      break;
    }
  }

  const box = { x:e.x, y:e.y, w:e.w, h:e.h };

  // swing connects
  if (sw && hit(sw, box)){
    e.hp--;
    audio.sfx('bonk'); game.shake = 5;
    burst(e.x + e.w/2, e.y + e.h/2, '#fcfcfc', 10, 2);
    if (e.hp <= 0){
      e.dizzy = 40; e.face = P.face; game.score += 250;
      popText(e.x + e.w/2, e.y - 8, e.type === 'hockey' ? 'SORRY!' : 'HONK!',
              e.type === 'hockey' ? '#68c0f8' : '#f8d000');
    }
    return;
  }
  // stomp
  if (hit(P, box) && P.vy > 0.8 && P.y + P.h - P.vy <= e.y + 6){
    e.hp = 0; e.dizzy = 40; e.face = P.face; P.vy = -5.4;
    game.score += 200; audio.sfx('bonk');
    popText(e.x + e.w/2, e.y - 8, 'BOING!', '#40a828');
    return;
  }
  if (hit(P, box)) hurtPlayer(Math.sign(P.x - e.x) || -1);
}

/* ======================================================================
   SECRET LEVEL — THE CORN POP CAPER
   Reached from Hole 1 by climbing the three-platform stack near the end
   and grabbing the golden ball. Beat the Big Guy, spring Corn Pop, come
   back out onto the same fairway with a bonus decree in your pocket.
   ====================================================================== */
const SECRET = 3;

function buildSecret(){
  world.solids = []; world.hazards = []; world.coins = [];
  world.enemies = []; world.shots = []; world.done = false;
  world.boss = null; world.secret = null; world.sign = null;
  world.theme = 'pool'; world.len = 512; world.goal = 99999;
  parts.length = 0;
  world.solids.push(ground(0, 512));
  [[80,132],[196,106],[312,132]].forEach(p => world.solids.push({ x:p[0], y:p[1], w:56, h:10 }));
  world.solids.push({ x:500, y:60, w:12, h:124 });
  world.biden   = { x:300, y:152, w:16, h:24, vx:-1.6, hp:5, hurt:0, t:0,
                    face:-1, dead:false, state:'ride', cast:0, done:0 };
  world.cage    = { x:436, y:150, w:34, h:34, open:false };
  world.cornpop = { x:444, y:160, free:false, t:0, face:-1 };
  P.w = 10; P.h = 22; P.x = 24; P.y = 150;
  P.vx = P.vy = 0; P.face = 1; P.swing = 0; P.inv = 90; P.dead = false; P.onGround = false;
  game.hearts = 3;
}

function warpToSecret(){
  game.stash = { w: Object.assign({}, world), x:P.x, y:P.y, idx:game.levelIndex };
  audio.sfx('eagle'); game.flash = 12;
  buildSecret();
  game.levelIndex = SECRET;
  game.state = 'intro';
  audio.music(null);
}
function clearSecret(){ game.state = 'secretclear'; audio.music(null); audio.sfx('clear'); }
function returnFromSecret(){
  const st = game.stash;
  Object.assign(world, st.w);          // buildSecret handed out fresh arrays, so these survived
  world.secret.taken = true;
  game.secretDone = true;
  game.levelIndex = st.idx;
  P.w = 10; P.h = 22; P.x = st.x; P.y = st.y - 4;
  P.vx = P.vy = 0; P.inv = 90; P.swing = 0;
  game.hearts = 3;
  game.state = 'play';
  audio.music(LEVELS[game.levelIndex].music);
  say('BACK ON THE COURSE. CORN POP SENDS HIS REGARDS.', 150);
}

function updateBiden(sw){
  const b = world.biden, c = world.cornpop;
  b.t++;
  if (b.hurt > 0) b.hurt--;

  if (b.dead){
    if (b.done++ === 0){
      world.cage.open = true; c.free = true;
      game.score += 5000;
      popText(b.x + 8, b.y - 10, 'CORN POP IS FREE!', '#40e058');
      say('THE CAGE IS OPEN. CORN POP WALKS.', 200);
      audio.sfx('eagle');
    }
    if (b.done % 10 === 0) burst(b.x + 8, b.y + 18, '#68c0f8', 3, 1.2);
    if (b.done > 190) clearSecret();
  } else if (b.state === 'ride'){
    b.x += b.vx;
    if (b.x < 8 || b.x + b.w > world.len - 40) b.vx *= -1;
    b.face = b.vx < 0 ? -1 : 1;
    if (b.t % 120 === 0){ b.state = 'toss'; b.cast = 0; }
  } else {
    b.cast++;
    b.face = Math.sign(P.x - b.x) || b.face;
    if (b.cast === 18 || b.cast === 36){
      world.shots.push({ x:b.x + 6, y:b.y + 6, w:6, h:6, kind:'scoop',
                         vx:(Math.sign(P.x - b.x) || 1) * 2.1, vy:-2.6, grav:0.16 });
      audio.sfx('swing');
    }
    if (b.cast > 54) b.state = 'ride';
  }

  if (!b.dead){
    const box2 = { x:b.x, y:b.y, w:b.w, h:b.h };
    if (sw && hit(sw, box2) && b.hurt === 0){
      b.hp--; b.hurt = 45; game.shake = 8;
      audio.sfx('bonk'); burst(b.x + 8, b.y + 12, '#68c0f8', 14, 2.4);
      P.vx = -P.face * 3;
      if (b.hp <= 0){ b.dead = true; b.done = 0; }
      else popText(b.x + 8, b.y - 10, b.hp + ' LEFT', '#fcfcfc');
    } else if (hit(P, box2) && b.hurt === 0){
      hurtPlayer(Math.sign(P.x - b.x) || -1);
    }
  }
  if (c.free){ c.t++; if (c.x > P.x + 26){ c.x -= 0.8; c.face = -1; } }
}

/* --------------------------------- boss ---------------------------------- */
function updateBoss(sw){
  const b = world.boss;
  if (b.dead){
    b.y += 0.6; b.t++;
    if (b.t % 8 === 0) burst(b.x + 24, b.y + 22, '#a06030', 4, 1.4);
    return;
  }
  if (!b.intro && P.x > 2820){
    b.intro = true;
    say('THE GREAT MOOSE OF THE NORTH', 150);
    audio.music('north');
  }
  if (!b.intro) return;

  b.t++;
  if (b.hurt > 0) b.hurt--;

  if (b.state === 'idle'){
    b.vx = 0;
    if (b.t % 70 === 0){ b.state = 'charge'; b.face = Math.sign(P.x - b.x) || -1; b.vx = b.face * 2.3; }
  } else if (b.state === 'charge'){
    b.x += b.vx;
    if (b.x < 2740 || b.x + b.w > 3140){ b.vx *= -1; b.face *= -1; }
    if (b.t % 70 === 0){ b.state = 'idle'; audio.noise(0.08, 0.08); }
  }
  b.y = 146 + Math.abs(Math.sin(b.t * 0.08)) * -4;

  const box = { x:b.x, y:b.y, w:b.w, h:b.h };
  if (sw && hit(sw, box) && b.hurt === 0){
    b.hp--; b.hurt = 40; game.shake = 9;
    audio.sfx('bonk'); burst(b.x + 24, b.y + 18, '#f8d000', 16, 2.6);
    P.vx = -P.face * 3;
    if (b.hp <= 0){
      b.dead = true; b.t = 0; game.score += 2500;
      popText(b.x + 24, b.y - 10, 'MOOSE DEFEATED!', '#f8d000');
      say('THE MOOSE CONCEDES. GO PLANT THE FLAG!', 170);
      audio.sfx('clear');
    } else {
      popText(b.x + 24, b.y - 10, b.hp + ' LEFT', '#fcfcfc');
    }
    return;
  }
  if (hit(P, box) && b.hurt === 0) hurtPlayer(Math.sign(P.x - b.x) || -1);
}

function drawBackdrop(theme, camX){
  if (theme === 'golf'){
    ditherSky('golf', [[0,'#1c68d8'],[0.35,'#4c9cf0'],[0.7,'#8cd0f8'],[1,'#d8f0ff']], 0, 200);

    g.globalAlpha = 0.18; g.fillStyle = '#fff8c0';
    g.beginPath(); g.arc(212, 34, 26, 0, 7); g.fill(); g.globalAlpha = 1;
    g.fillStyle = '#fff8c0'; g.beginPath(); g.arc(212, 34, 15, 0, 7); g.fill();
    g.fillStyle = '#ffffff'; g.beginPath(); g.arc(210, 31, 9, 0, 7); g.fill();

    // clouds, two layers, the far one hazed
    for (let L=0; L<2; L++){
      const spd = L ? 0.22 : 0.10, sc = L ? 1 : 0.7;
      g.fillStyle = L ? '#ffffff' : 'rgba(255,255,255,0.55)';
      for (let i=0;i<5;i++){
        const x = ((i*103 + L*47 - camX*spd) % (W+90) + W+90) % (W+90) - 45;
        const y = 14 + ((i*31 + L*17) % 46);
        g.fillRect(x, y, 30*sc, 6*sc); g.fillRect(x+6*sc, y-4*sc, 18*sc, 6*sc);
        g.fillRect(x+2*sc, y+5*sc, 24*sc, 3*sc);
      }
    }
    // far ridge
    g.fillStyle = '#2a6a3c';
    for (let i=0;i<9;i++){
      const x = ((i*150 - camX*0.16) % (W+300) + W+300) % (W+300) - 150;
      g.beginPath(); g.arc(x, 196, 74, Math.PI, 0); g.fill();
    }
    haze('#8cd0f8', 0.45, 120, 200);
    // mid hills
    g.fillStyle = '#2b7a1f';
    for (let i=0;i<9;i++){
      const x = ((i*140 - camX*0.35) % (W+280) + W+280) % (W+280) - 140;
      g.beginPath(); g.arc(x, 192, 66, Math.PI, 0); g.fill();
    }
    haze('#8cd0f8', 0.18, 130, 200);
    // near hills, lit along the top
    for (let i=0;i<9;i++){
      const x = ((i*110 - camX*0.55) % (W+220) + W+220) % (W+220) - 110;
      g.fillStyle = '#34901f';
      g.beginPath(); g.arc(x, 202, 52, Math.PI, 0); g.fill();
      g.fillStyle = '#4fb62c';
      g.beginPath(); g.arc(x, 200, 52, Math.PI*1.08, Math.PI*1.55); g.fill();
    }
    // grass tufts swaying at the treeline
    for (let i=0;i<26;i++){
      const x = ((i*37 - camX*0.72) % (W+40) + W+40) % (W+40) - 20;
      const sway = Math.sin(game.tick*0.045 + i) * 1.4;
      g.fillStyle = '#2f8a20';
      g.fillRect(x, 176, 1, 6); g.fillRect(x+sway, 172, 1, 5);
      g.fillRect(x+2, 177, 1, 5); g.fillRect(x+2+sway*0.6, 174, 1, 4);
    }
  } else if (theme === 'pool'){
    g.fillStyle = '#0e2430'; g.fillRect(0,0,W,H);
    const off = (camX * 0.3) % 16;
    for (let ty=0; ty<184; ty+=16) for (let tx=-16; tx<W+16; tx+=16){
      g.fillStyle = (((tx+ty)/16)|0) % 2 ? '#164450' : '#123742';
      g.fillRect(tx - off, ty, 15, 15);
    }
    for (let i=0;i<6;i++){
      const x = ((i*74 - camX*0.3) % (W+74) + W+74) % (W+74) - 37;
      g.globalAlpha = 0.10; g.fillStyle = '#ffffff';
      g.beginPath(); g.moveTo(x, 14); g.lineTo(x+26, 14);
      g.lineTo(x+44, 184); g.lineTo(x-18, 184); g.closePath(); g.fill();
      g.globalAlpha = 1;
      g.fillStyle = '#f8f0c0'; g.fillRect(x, 9, 26, 5);
      g.fillStyle = '#8c9098'; g.fillRect(x+11, 0, 4, 9);
    }
    const sx = 150 - camX * 0.3;
    text('DELAWARE REC CENTER', sx, 74, '#7ad0e8', 'center', 10);
    text('POOL RULES: NO CHAINS, NO BAD DUDES', sx, 88, '#3f8798', 'center', 7);
  } else {
    ditherSky('north', [[0,'#080c30'],[0.4,'#1a2c68'],[0.75,'#3a58a0'],[1,'#7c9cd0']], 0, 200);
    // aurora, three ribbons
    for (let i=0;i<3;i++){
      g.globalAlpha = 0.16 + i*0.05;
      g.fillStyle = i===1 ? '#68f8c0' : i===2 ? '#a888f8' : '#8ca8f8';
      for (let x=0;x<W;x+=2){
        const yy = 26 + i*15 + Math.sin((x + game.tick*0.7 + i*40)*0.028) * 11;
        g.fillRect(x, yy, 2, 11);
        g.globalAlpha *= 0.999;
      }
      g.globalAlpha = 1;
    }
    // stars, two depths
    for (let i=0;i<34;i++){
      const x = ((i*53 - camX*0.05) % W + W) % W;
      const tw = (game.tick + i*29) % 120 < 60 ? '#fcfcfc' : '#a8b4d8';
      g.fillStyle = i%4 ? '#8c9ac0' : tw;
      g.fillRect(x, (i*37) % 78, 1, 1);
    }
    // three pine layers, far ones fogged into the sky
    const PINES = [[0.14,182,20,'#0a1f14'],[0.32,192,26,'#0d2a16'],[0.55,202,32,'#14401e']];
    PINES.forEach(([spd, base, size, col], li) => {
      g.fillStyle = col;
      for (let i=0;i<16;i++){
        const x = ((i*(size*2.6) - camX*spd) % (W+180) + W+180) % (W+180) - 90;
        g.beginPath(); g.moveTo(x, base); g.lineTo(x+size/2, base-size*1.5);
        g.lineTo(x+size, base); g.closePath(); g.fill();
        g.fillStyle = '#e8f0ff';                       // snow caught on the crown
        g.fillRect(x+size/2-1, base-size*1.5+2, 3, 2);
        g.fillStyle = col;
      }
      if (li < 2) haze('#3a58a0', li ? 0.16 : 0.34, base-size*1.6, 200);
    });
    // snowfall, three depths
    for (let L=0; L<3; L++){
      const n = 14, spd = 0.5 + L*0.55, sz = L === 2 ? 2 : 1;
      g.globalAlpha = 0.35 + L*0.22; g.fillStyle = '#ffffff';
      for (let i=0;i<n;i++){
        const k = i + L*17;
        const x = ((k*61 + game.tick*spd*0.5 - camX*(0.2+L*0.25)) % (W+20) + W+20) % (W+20);
        const y = ((k*47 + game.tick*spd) % (H+10));
        g.fillRect(x, y, sz, sz);
      }
      g.globalAlpha = 1;
    }
  }
}

const LIT = { golf:'#7ae84c', north:'#ffffff', pool:'#c4f0ff' };
const GROUND = {   // [top, upper, body, shadow, body highlight]
  golf:  ['#3fb52c','#2f8a20','#7a4a20','#4e2a0c','#9a6438'],
  north: ['#eef4ff','#c4d2ea','#4e5876','#2e3550','#6c7896'],
  pool:  ['#8cd8e8','#4c9cb0','#2c5c70','#16303e','#3f7d94']
};
function drawSolids(camX){
  const [c0,c1,c2,c3,c4] = GROUND[world.theme] || GROUND.golf;
  for (const s of world.solids){
    const x = s.x - camX;
    if (x > W || x + s.w < 0) continue;
    if (s.h > 20){                                   // ground slab
      g.fillStyle = c0; g.fillRect(x, s.y+1, s.w, 5);
      g.fillStyle = LIT[world.theme] || '#6ee048'; g.fillRect(x, s.y, s.w, 1);
      g.fillStyle = c1; g.fillRect(x, s.y+6, s.w, 5);
      g.fillStyle = c3; g.fillRect(x, s.y+11, s.w, 1);      // contact shadow
      g.fillStyle = c2; g.fillRect(x, s.y+12, s.w, s.h-12);
      g.fillStyle = c3;
      for (let i=0;i<s.w;i+=16){
        g.fillRect(x+i+3, s.y+18, 7, 3); g.fillRect(x+i+11, s.y+26, 4, 2);
        g.fillRect(x+i+6, s.y+33, 5, 2);
      }
      g.fillStyle = c4;
      for (let i=0;i<s.w;i+=16){ g.fillRect(x+i+3, s.y+17, 7, 1); g.fillRect(x+i+11, s.y+25, 4, 1); }
      g.fillStyle = 'rgba(0,0,0,0.25)';                      // edge falloff
      g.fillRect(x, s.y+12, 2, s.h-12); g.fillRect(x+s.w-2, s.y+12, 2, s.h-12);
    } else if (s.h > 40 || s.w < 16){                // arena wall
      g.fillStyle = '#5a6478'; g.fillRect(x, s.y, s.w, s.h);
      g.fillStyle = '#8c98b0'; g.fillRect(x, s.y, s.w, 2);
    } else {                                          // floating platform
      g.fillStyle = '#000'; g.fillRect(x-1, s.y-1, s.w+2, s.h+2);
      g.fillStyle = c0; g.fillRect(x, s.y+1, s.w, 3);
      g.fillStyle = LIT[world.theme] || '#6ee048'; g.fillRect(x, s.y, s.w, 1);
      g.fillStyle = c2; g.fillRect(x, s.y+4, s.w, s.h-5);
      g.fillStyle = c3; g.fillRect(x, s.y+s.h-1, s.w, 1);
      g.fillStyle = 'rgba(255,255,255,0.16)'; g.fillRect(x, s.y+4, 1, s.h-5);
      g.fillStyle = 'rgba(0,0,0,0.30)';       g.fillRect(x+s.w-1, s.y+4, 1, s.h-5);
    }
  }
  for (const hz of world.hazards){
    const x = hz.x - camX;
    if (x > W || x + hz.w < 0) continue;
    if (hz.kind === 'sand'){
      g.fillStyle = '#e8d090'; g.fillRect(x, hz.y, hz.w, hz.h);
      g.fillStyle = '#c8a860';
      for (let i=0;i<hz.w;i+=7) g.fillRect(x+i+2, hz.y+4+((i/7|0)%3)*4, 2, 1);
    } else {
      g.fillStyle = '#2c68b8'; g.fillRect(x, hz.y, hz.w, hz.h);
      g.fillStyle = '#68c0f8';
      for (let i=0;i<hz.w;i+=9) g.fillRect(x+i+((game.tick/6|0)%4), hz.y+2, 5, 1);
    }
  }
}

function drawGoal(camX){

function drawEnemy(e, camX){
  if (e.gone) return;
  const x = e.x - camX; if (x < -40 || x > W+40) return;
  g.save();
  if (e.dizzy > 0){
    g.translate(x + e.w/2, e.y + e.h/2);
    g.rotate(e.dizzy * 0.35);
    g.translate(-e.w/2, -e.h/2);
    if (e.type === 'goose') drawSpr(GOOSE, 0, 0, e.face > 0);
    if (e.type === 'hockey') drawSpr(HOCKEY, 0, 0, e.face > 0);
    if (e.type === 'moose')  drawSpr(MOOSE, 0, 0, e.face > 0);
    g.restore();
    return;
  }
  g.restore();
  if (e.type === 'goose'){
    drawSpr(GOOSE, x, e.y, e.face > 0);
  } else if (e.type === 'hockey'){
    drawSpr(HOCKEY, x, e.y, e.face > 0);
    // stick
    g.fillStyle = '#a06030';
    const sx = e.face < 0 ? x - 8 : x + e.w;
    g.fillRect(sx, e.y + 10, 8, 2);
    g.fillStyle = '#202020'; g.fillRect(e.face < 0 ? sx-2 : sx+8, e.y+11, 3, 4);
  } else if (e.type === 'moose'){
    const bob = Math.sin(e.anim) * 1.2;
    drawSpr(MOOSE, x, e.y + bob, e.face > 0);
  }
}

function drawPlayer(camX){
  if (P.inv > 0 && (game.tick >> 2) % 2 === 0) return;
  const x = P.x - 3 - camX, y = P.y - 2;
  let frame = HERO.idle;
  if (!P.onGround) frame = HERO.jump;
  else if (Math.abs(P.vx) > 0.25) frame = ((P.anim | 0) % 2) ? HERO.walk1 : HERO.walk2;

  // soft contact shadow on the ground below
  if (P.onGround){
    g.globalAlpha = 0.28; g.fillStyle = '#000000';
    g.fillRect(Math.round(x)+2, Math.round(y)+23, 12, 2); g.globalAlpha = 1;
  }
  const q = P.squash;
  if (q){
    const cx = Math.round(x) + 8, fy = Math.round(y) + 24;
    g.save(); g.translate(cx, fy); g.scale(1 - q*0.16, 1 + q*0.20); g.translate(-cx, -fy);
    drawSpr(frame, x, y, P.face < 0);
    g.restore();
  } else drawSpr(frame, x, y, P.face < 0);

  if (P.swing > 0){                                  // golf club arc
    const prog = 1 - P.swing / 18;
    const ang  = (-2.3 + prog * 3.2) * P.face;
    const px = x + (P.face > 0 ? 12 : 4), py = y + 15;
    g.save(); g.translate(px, py); g.rotate(ang);
    g.fillStyle = '#3c4048'; g.fillRect(-1, -18, 2, 18);
    g.fillStyle = '#c8ccd8'; g.fillRect(-3, -22, 6, 5);
    g.restore();
    if (P.swing === 12){ burst(P.x + P.face*10, P.y+8, '#ffffff', 4, 1.2, 12); }
  }
}

function drawHud(){
  const grad = g.createLinearGradient(0,0,0,16);
  grad.addColorStop(0,'rgba(20,24,54,0.94)'); grad.addColorStop(1,'rgba(6,8,20,0.80)');
  g.fillStyle = grad; g.fillRect(0,0,W,16);
  g.fillStyle = '#4c5c9c'; g.fillRect(0,15,W,1);
  g.fillStyle = '#8ca0e0'; g.fillRect(0,16,W,1);
  g.globalAlpha = 0.35; g.fillStyle = '#000'; g.fillRect(0,17,W,2); g.globalAlpha = 1;
  for (let i=0;i<3;i++){
    const on = i < game.hearts, x = 5 + i*11;
    g.fillStyle = on ? '#d82800' : '#40404a';

/* ========================================================================
   LEVEL 2 — CHOPPER ONE (auto-scrolling shooter)
   ======================================================================== */
const air = { dist:0, target:4200, enemies:[], shots:[], foe:[], pickups:[],
              wing:0, spawn:0, cool:0, nextEagle:700 };

function buildAir(){
  air.dist = 0; air.enemies = []; air.shots = []; air.foe = []; air.pickups = [];
  air.wing = 0; air.spawn = 40; air.cool = 0; air.nextEagle = 700;
  parts.length = 0;
  P.x = 30; P.y = 100; P.vx = 0; P.vy = 0; P.w = 28; P.h = 16;
  P.inv = 80; P.face = 1;
  game.hearts = 3;
}

function spawnAirFoe(){
  const roll = Math.random();
  if (roll < 0.42){
    air.enemies.push({ kind:'gull', x:W+16, y:rnd(28,180), w:14, h:14,
                       vx:-1.9, hp:1, t:rnd(0,6), amp:rnd(10,26) });
  } else if (roll < 0.78){
    air.enemies.push({ kind:'blimp', x:W+22, y:rnd(26,168), w:20, h:14,
                       vx:-1.05, hp:2, t:0 });
  } else {
    air.enemies.push({ kind:'cloud', x:W+24, y:rnd(24,110), w:22, h:12,
                       vx:-0.8, hp:3, t:0, cool:60 });
  }
}

function updateAir(){
  air.dist += 2;

  /* movement */
  const spd = 2.0;
  if (keys.left)  P.x -= spd;
  if (keys.right) P.x += spd;
  if (keys.up)    P.y -= spd;
  if (keys.down)  P.y += spd;
  P.x = clamp(P.x, 0, W - P.w);
  P.y = clamp(P.y, 18, H - P.h - 22);

  /* fire */
  if (air.cool > 0) air.cool--;
  if (keys.act && air.cool === 0){
    air.cool = 11;
    air.shots.push({ x:P.x + P.w, y:P.y + 7, w:6, h:3, vx:4.6 });
    if (air.wing > 0) air.shots.push({ x:P.x + 20, y:P.y - 12, w:5, h:3, vx:4.6, gold:true });
    audio.sfx('shoot');
  }
  if (air.wing > 0) air.wing--;
  if (P.inv > 0) P.inv--;

  /* spawns */
  if (--air.spawn <= 0){
    spawnAirFoe();
    air.spawn = Math.max(24, 62 - Math.floor(air.dist / 120) * 3);
  }
  if (air.dist > air.nextEagle){
    air.nextEagle += 780;
    air.pickups.push({ x:W+16, y:rnd(40,160), w:16, h:12, vx:-1.3, t:0 });
  }

  /* player shots */
  for (let i=air.shots.length-1;i>=0;i--){
    const s = air.shots[i]; s.x += s.vx;
    let killed = false;
    for (const e of air.enemies){
      if (e.dead) continue;
      if (hit(s, e)){
        e.hp--; killed = true;
        burst(s.x, s.y, '#f8d000', 5, 1.4, 14);
        if (e.hp <= 0){
          e.dead = true; e.t = 0;
          game.score += e.kind === 'cloud' ? 400 : e.kind === 'blimp' ? 300 : 150;
          audio.sfx('bonk');
          burst(e.x + e.w/2, e.y + e.h/2, e.kind==='blimp' ? '#d82800' : '#fcfcfc', 14, 2.4);
        }
        break;
      }
    }
    if (killed || s.x > W + 10) air.shots.splice(i,1);
  }

  /* enemies */
  for (let i=air.enemies.length-1;i>=0;i--){
    const e = air.enemies[i];
    if (e.dead){ e.t++; e.y += 1.6; e.x -= 0.6; if (e.t > 26) air.enemies.splice(i,1); continue; }
    e.t += 0.08; e.x += e.vx;
    if (e.kind === 'gull') e.y += Math.sin(e.t) * 0.9;
    if (e.kind === 'cloud' && --e.cool <= 0){
      e.cool = 90;
      air.foe.push({ x:e.x + 10, y:e.y + 12, w:3, h:8, vy:2.4 });
    }
    if (e.x + e.w < -6){ air.enemies.splice(i,1); continue; }
    if (P.inv <= 0 && hit(P, e)){
      hurtPlayer(0); e.dead = true; e.t = 0;
      burst(P.x+14, P.y+8, '#d82800', 14, 2.4);
    }
  }

  /* lightning */
  for (let i=air.foe.length-1;i>=0;i--){
    const f = air.foe[i]; f.y += f.vy;
    if (f.y > H){ air.foe.splice(i,1); continue; }
    if (P.inv <= 0 && hit(P, f)){ hurtPlayer(0); air.foe.splice(i,1); }
  }

  /* eagle pickups */
  for (let i=air.pickups.length-1;i>=0;i--){
    const p = air.pickups[i]; p.x += p.vx; p.t += 0.14;
    p.y += Math.sin(p.t) * 0.7;
    if (p.x + p.w < -6){ air.pickups.splice(i,1); continue; }
    if (hit(P, p)){
      air.pickups.splice(i,1);
      air.wing = 900; game.score += 500;
      if (game.hearts < 3) game.hearts++;
      audio.sfx('eagle');
      popText(P.x + 14, P.y - 10, 'EAGLE ESCORT!', '#f8d000');
      burst(P.x+14, P.y+8, '#fcfcfc', 16, 2.6);
    }
  }

  updateParts();
  if (air.dist >= air.target) clearLevel();
}

function drawAir(){
  ditherSky('air', [[0,'#12309c'],[0.4,'#3c78e0'],[0.75,'#7cbcf8'],[1,'#cceaff']], 0, H-22);

  const sc = air.dist;
  // far clouds
  g.fillStyle = 'rgba(255,255,255,0.55)';
  for (let i=0;i<7;i++){
    const x = ((i*89 - sc*0.35) % (W+90) + W+90) % (W+90) - 45;
    const y = 24 + (i*29) % 120;
    g.fillRect(x, y, 34, 7); g.fillRect(x+8, y-5, 20, 7);
  }
  // ground far below
  g.fillStyle = '#2f7a24'; g.fillRect(0, H-22, W, 22);
  g.fillStyle = '#4fb62c'; g.fillRect(0, H-22, W, 2);
  g.fillStyle = '#1c5416'; g.fillRect(0, H-6, W, 6);
  g.fillStyle = '#245f1c';
  for (let i=0;i<12;i++){
    const x = ((i*47 - sc*0.9) % (W+50) + W+50) % (W+50) - 25;
    g.fillRect(x, H-22, 18, 4);
  }
  g.fillStyle = '#8c8ca0';
  for (let i=0;i<5;i++){                              // skyline blur
    const x = ((i*79 - sc*1.3) % (W+80) + W+80) % (W+80) - 40;
    const h2 = 12 + (i%3)*8;
    g.fillRect(x, H-22-h2, 14, h2);
  }

  // eagle escort
  if (air.wing > 0 && (air.wing > 120 || (game.tick>>2)%2)){
    const ex = P.x + 6, ey = P.y - 16 + Math.sin(game.tick*0.14)*2;
    drawSpr((game.tick>>3)%2 ? EAGLE_UP : EAGLE_DN, ex, ey, false);
  }

  // pickups
  for (const p of air.pickups){
    g.globalAlpha = 0.35; g.fillStyle = '#f8d000';
    g.fillRect(p.x-3, p.y-3, p.w+6, p.h+6); g.globalAlpha = 1;
    drawSpr((game.tick>>3)%2 ? EAGLE_UP : EAGLE_DN, p.x, p.y, false);
  }

  // enemies
  for (const e of air.enemies){
    g.save();
    if (e.dead){ g.globalAlpha = 0.6; g.translate(e.x+e.w/2, e.y+e.h/2); g.rotate(e.t*0.3); g.translate(-e.w/2,-e.h/2); }
    const dx = e.dead ? 0 : e.x, dy = e.dead ? 0 : e.y;
    if (e.kind === 'gull')  drawSpr(GOOSE, dx, dy, true);
    if (e.kind === 'blimp') drawSpr(BLIMP, dx, dy, false);
    if (e.kind === 'cloud') drawSpr(CLOUD, dx, dy, false);
    g.restore(); g.globalAlpha = 1;
  }
  // lightning
  g.fillStyle = '#f8f800';
  for (const f of air.foe){ g.fillRect(f.x, f.y, 2, 6); g.fillRect(f.x+1, f.y+3, 2, 5); }
  // shots
  for (const s of air.shots){ g.fillStyle = s.gold ? '#f8d000' : '#fcfcfc'; g.fillRect(s.x, s.y, s.w, s.h); }

  // chopper
  if (!(P.inv > 0 && (game.tick>>2)%2 === 0)){
    drawSpr(CHOPPER, P.x, P.y, false);
    g.fillStyle = '#202028';
    const spin = Math.abs(Math.sin(game.tick * 0.9)) * 13 + 1;
    g.fillRect(P.x + 13 - spin, P.y + 1, spin * 2, 2);
  }
  drawParts(0);

  // distance bar
  box(0,0,W,16,'rgba(8,8,20,0.72)');
  for (let i=0;i<3;i++){
    const on = i < game.hearts, x = 5 + i*11;
    g.fillStyle = on ? '#d82800' : '#40404a';
    g.fillRect(x+1,4,2,2); g.fillRect(x+5,4,2,2);
    g.fillRect(x,6,8,2); g.fillRect(x+1,8,6,2); g.fillRect(x+2,10,4,1); g.fillRect(x+3,11,2,1);
  }
  const pw = 76, px = 44;
  box(px, 5, pw, 6, '#101828', '#68c0f8');
  g.fillStyle = '#40e058';
  g.fillRect(px+1, 6, Math.round((pw-2) * clamp(air.dist/air.target,0,1)), 4);
  text('NORTH', px+pw+3, 4, '#68c0f8', 'left', 7);
  text('SCORE ' + String(game.score).padStart(6,'0'), W-4, 4, '#f8d000', 'right');
}

function handleTyping(e){
  if (e.key === 'Enter'){
    const v = typingBuffer.trim();
    typingBuffer = null;
    if (v) commitRename(v.toUpperCase());
    return true;
  }
  if (e.key === 'Escape'){ typingBuffer = null; audio.sfx('menu'); return true; }
  if (e.key === 'Backspace'){ typingBuffer = typingBuffer.slice(0,-1); audio.sfx('menu'); return true; }
  if (e.key.length === 1 && typingBuffer.length < 24){
    typingBuffer += e.key.toUpperCase(); audio.sfx('menu');
  }
  return true;
}
function commitRename(name){
  const pl = game.decrees[rename.idx];
  game.renames[pl.id] = name;
  rename.stamp = 58;
  game.score += 1000;
  audio.sfx('stamp'); game.shake = 8;
  burst(128, 150, '#f8d000', 22, 3, 40);
}

function updateRename(){
  updateParts();
  if (typingBuffer !== null) return;
  if (rename.stamp > 0){
    if (--rename.stamp === 0){
      rename.idx++; rename.sel = 0;
      if (rename.idx >= game.decrees.length){
        game.state = 'ending'; rename.scroll = 0; audio.music('hail');
      }
    }
    return;
  }
  const max = 4;                                   // 3 presets + custom
  if (tap('up'))   { rename.sel = (rename.sel + max - 1) % max; audio.sfx('menu'); }
  if (tap('down')) { rename.sel = (rename.sel + 1) % max; audio.sfx('menu'); }
  if (tap('left')) { rename.sel = (rename.sel + max - 1) % max; audio.sfx('menu'); }
  if (tap('right')){ rename.sel = (rename.sel + 1) % max; audio.sfx('menu'); }
  if (tap('start') || tap('act')){
    if (rename.sel === 3) { typingBuffer = ''; audio.sfx('menu'); }
    else commitRename(game.decrees[rename.idx].opts[rename.sel]);
  }
}

function drawSeal(cx, cy, r, a){
  g.globalAlpha = a;
  g.fillStyle = '#b08000'; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
  g.fillStyle = '#f8d000'; g.beginPath(); g.arc(cx, cy, r-2, 0, 7); g.fill();
  g.strokeStyle = '#8c6000'; g.lineWidth = 1;
  g.beginPath(); g.arc(cx, cy, r-5, 0, 7); g.stroke();
  for (let i=0;i<12;i++){
    const an = i/12 * Math.PI*2;
    g.fillStyle = '#b08000';
    g.fillRect(cx + Math.cos(an)*(r-1) - 1, cy + Math.sin(an)*(r-1) - 1, 2, 2);
  }
  text('SEAL', cx, cy - 7, '#7a5200', 'center', 7);
  text('OF THE', cx, cy - 1, '#7a5200', 'center', 6);
  text('BOSS', cx, cy + 5, '#7a5200', 'center', 7);
  g.globalAlpha = 1;
}

  drawSpr(HERO.idle, 116, 152, false);
  drawSpr(MOOSE, 200, 158, true);
  drawSpr(GOOSE, 34, 164, false);

  text('THE QUEST TO RENAME', 128, 14, '#fcfcfc', 'center', 14);
  text('WONDERS & WATERWAYS', 128, 30, '#f8d000', 'center', 18);
  text('OF THE WORLD', 128, 54, '#fcfcfc', 'center', 14);
  text('AN 8-BIT PARODY IN THREE HOLES', 128, 76, '#68c0f8', 'center', 8);
  text('GOLF - CHOPPERS - EAGLES - MOOSE', 128, 88, '#f89828', 'center', 8);

  if ((game.tick>>4)%2) text('PRESS ENTER TO TEE OFF', 128, 128, '#fcfcfc', 'center', 10);
  text('ARROWS MOVE  •  SPACE JUMP  •  X SWING/FIRE', 128, 208, '#c8d0f0', 'center', 7);
  text('M MUTE', 6, 6, '#8c98c8', 'left', 7);
}

function drawIntro(){
  const L = LEVELS[game.levelIndex];
  g.fillStyle = '#080c1c'; g.fillRect(0,0,W,H);
  box(14, 40, W-28, 128, '#131a38', '#3c4c88');
  text(L.tag, 128, 52, '#68c0f8', 'center', 9);
  text(L.name, 128, 68, '#f8d000', 'center', 15);
  g.fillStyle = '#3c4c88'; g.fillRect(30, 90, W-60, 1);
  L.blurb.forEach((line, i) => text(line, 128, 98 + i*12, '#dfe4f8', 'center', 8));
  text(game.levelIndex === SECRET ? 'REWARD: ONE (1) BONUS DECREE'
                                  : 'REWARD: ONE (1) NAMING RIGHT', 128, 150, '#f89828', 'center', 8);
  if ((game.tick>>4)%2) text('PRESS ENTER', 128, 184, '#fcfcfc', 'center', 10);
  drawSpr(HERO.idle, 20, 176, false);
  drawSpr(CHOPPER, 200, 180, false);
}

function drawLevelClear(){
  g.fillStyle = '#08140c'; g.fillRect(0,0,W,H);
  for (let i=0;i<40;i++){
    const x = (i*89 + game.tick) % W, y = (i*53 + game.tick*2) % H;
    g.fillStyle = ['#f8d000','#fcfcfc','#d82800','#68c0f8'][i%4];
    g.fillRect(x, y, 2, 2);
  }
  box(18, 54, W-36, 108, '#0e2a18', '#40a828');
  text('HOLE CLEARED', 128, 66, '#f8d000', 'center', 18);
  text(LEVELS[game.levelIndex].name, 128, 92, '#fcfcfc', 'center', 9);
  text('SCORE  ' + String(game.score).padStart(6,'0'), 128, 110, '#68c0f8', 'center', 10);
  const left = LEVELS.length - game.levelIndex - 1;
  text(left > 0 ? left + ' HOLE' + (left>1?'S':'') + ' UNTIL THE CEREMONY'
                : 'ALL THREE HOLES CLEARED', 128, 132, '#f89828', 'center', 8);
  text(left > 0 ? 'NAMING RIGHTS ACCRUING...' : 'REPORT TO THE SIGNING TABLE.',
       128, 144, '#a8b4e0', 'center', 7);
  if ((game.tick>>4)%2) text('PRESS ENTER', 128, 178, '#fcfcfc', 'center', 10);
  drawSpr(HERO.idle, 118, 176, false);
}

function drawSecretClear(){
  g.fillStyle = '#06180e'; g.fillRect(0,0,W,H);
  for (let i=0;i<30;i++){
    const x = (i*97 + game.tick) % W, y = (i*61 + game.tick*2) % H;
    g.fillStyle = ['#40e058','#f8d000','#68c0f8'][i%3]; g.fillRect(x, y, 2, 2);
  }
  box(16, 40, W-32, 130, '#0c2c1a', '#40e058');
  text('SECRET CLEARED', 128, 50, '#40e058', 'center', 16);
  text('CORN POP IS FREE', 128, 74, '#fcfcfc', 'center', 12);
  text('HE MAINTAINS HE WAS NEVER IN ANY TROUBLE', 128, 96, '#a8e0c0', 'center', 7);
  text('BUT APPRECIATES THE GESTURE.', 128, 106, '#a8e0c0', 'center', 7);
  text('+5000  AND ONE BONUS DECREE', 128, 124, '#f8d000', 'center', 9);
  text('SCORE  ' + String(game.score).padStart(6,'0'), 128, 142, '#68c0f8', 'center', 9);
  if ((game.tick>>4)%2) text('PRESS ENTER', 128, 156, '#fcfcfc', 'center', 9);
  drawSpr(CORNPOP, 96, 176, false);
  drawSpr(HERO.idle, 146, 176, true);
}

function drawGameOver(){
  g.fillStyle = '#1c0808'; g.fillRect(0,0,W,H);
  box(20, 60, W-40, 100, '#2c0e0e', '#d82800');
  text('OUT OF BOUNDS', 128, 72, '#d82800', 'center', 18);
  text(GO_LINES[game.goLine], 128, 100, '#fcfcfc', 'center', 8);
  text('SCORE  ' + String(game.score).padStart(6,'0'), 128, 118, '#f8d000', 'center', 9);
  text('ENTER = RETRY HOLE   •   ESC = TITLE', 128, 138, '#f8a8a8', 'center', 7);
  drawSpr(GOOSE, 60, 168, false);
  drawSpr(MOOSE, 150, 160, true);
}
const GO_LINES = [
  'THE GEESE ARE FILING A COMPLAINT.',
  'THE MOOSE WOULD LIKE A WORD.',
  'YOUR BALL IS IN THE WATER. AGAIN.',
  'THE CADDY HAS RESIGNED.',
  'CANADA SAYS SORRY. SINCERELY.'
];

/* ========================================================================
   FLOW + MAIN LOOP
   ======================================================================== */
function startLevel(i){
  game.levelIndex = i;
  game.msg = null; parts.length = 0;
  if (LEVELS[i].kind === 'air') buildAir();
  else { P.w = 10; P.h = 22; buildLevel(i); }
  game.state = 'intro';
  audio.music(null);
}
function beginPlay(){
  game.state = 'play'; game.paused = false;
  audio.music(LEVELS[game.levelIndex].music);
}
function newGame(){
  game.score = 0; game.renames = {};
  game.secretDone = false; game.decrees = null; game.stash = null;
  rename.idx = 0; rename.sel = 0; rename.stamp = 0; rename.scroll = 0;
  typingBuffer = null;
  startLevel(0);
}

function update(){
  game.tick++;
  if (game.flash > 0) game.flash--;
  if (game.shake > 0) game.shake--;
  if (game.msgT > 0 && --game.msgT === 0) game.msg = null;

  switch(game.state){
    case 'title':
      if (audio.ctx) audio.music('title');
      if (tap('start') || tap('jump') || tap('act')){ audio.unlock(); newGame(); }
      break;
    case 'intro':
      if (tap('start') || tap('jump') || tap('act')) beginPlay();
      break;
    case 'play':
      if (game.paused) break;
      if (LEVELS[game.levelIndex].kind === 'air') updateAir();
      else updatePlatformer();
      break;
    case 'levelclear':
      if (tap('start') || tap('jump') || tap('act')){
        if (game.levelIndex + 1 < HOLES) startLevel(game.levelIndex + 1);
        else { game.state = 'rename'; rename.idx = 0; rename.sel = 0;
               game.decrees = activeDecrees(); audio.music('hail'); }
      }
      break;
    case 'gameover':
      if (tap('back')){ game.state = 'title'; audio.music(null); }
      else if (tap('start') || tap('jump') || tap('act')) startLevel(game.levelIndex);
      break;
    case 'secretclear':
      if (tap('start') || tap('jump') || tap('act')) returnFromSecret();
      break;
    case 'rename': updateRename(); break;
    case 'ending': updateEnding(); break;
  }
}

function drawPlay(){
  if (LEVELS[game.levelIndex].kind === 'air'){ drawAir(); return; }
  const camX = clamp(P.x + P.w/2 - W/2, 0, Math.max(0, world.len - W));
  drawBackdrop(world.theme, camX);
  drawSolids(camX);
  drawCoins(camX);
  drawGoal(camX);
  drawSecretBits(camX);
  for (const e of world.enemies) drawEnemy(e, camX);
  if (world.biden) drawSecretCast(camX);

  // pucks and ice cream
  for (const s of world.shots){
    const sx = Math.round(s.x - camX), sy = Math.round(s.y);
    if (s.kind === 'scoop'){
      g.fillStyle = '#e8a860'; g.fillRect(sx+1, sy+3, 4, 4);      // cone
      g.fillStyle = s.friendly ? '#f8d000' : '#f8b8d0';
      g.fillRect(sx+1, sy, 4, 4); g.fillRect(sx, sy+1, 6, 2);
    } else {
      g.fillStyle = s.friendly ? '#f8d000' : '#101010';
      g.fillRect(sx, sy, s.w, s.h);
    }
  }

  // boss
  const b = world.boss;
  if (b && b.intro){
    const bx = b.x - camX;
    g.save();
    if (b.hurt > 0 && (game.tick>>1)%2) g.globalAlpha = 0.55;
    const MW = MOOSE.width * 2, MH = MOOSE.height * 2;   // 2x, padding included
    const mx = bx - 4, my = b.y + b.h - MH + 2;
    if (b.dead){ g.translate(mx + MW/2, my + MH/2); g.rotate(b.t * 0.06);
                 g.translate(-MW/2, -MH/2); g.drawImage(MOOSE, 0, 0, MW, MH); }
    else if (b.face > 0){ g.translate(mx + MW, my); g.scale(-1,1); g.drawImage(MOOSE, 0, 0, MW, MH); }
    else g.drawImage(MOOSE, mx, my, MW, MH);
    g.restore(); g.globalAlpha = 1;
    if (!b.dead){
      box(60, 20, 136, 9, '#101828', '#fcfcfc');
      g.fillStyle = '#d82800'; g.fillRect(62, 22, Math.round(132 * b.hp / 6), 5);
      text('GREAT MOOSE', 128, 32, '#fcfcfc', 'center', 7);
    }
  }

  drawPlayer(camX);
  drawParts(camX);
  drawHud();
}

function render(){
  g.save();
  if (game.shake > 0) g.translate(rnd(-2,2) * (game.shake/10), rnd(-2,2) * (game.shake/10));

  switch(game.state){
    case 'title':      drawTitle(); break;
    case 'intro':      drawIntro(); break;
    case 'play':       drawPlay(); break;
    case 'levelclear': drawLevelClear(); break;
    case 'gameover':   drawGameOver(); break;
    case 'secretclear': drawSecretClear(); break;
    case 'rename':     drawRename(); break;
    case 'ending':     drawEnding(); break;
  }
  g.restore();

  if (game.state === 'play' && game.msg){
    const a = game.msgT > 20 ? 1 : game.msgT/20;
    g.globalAlpha = a;
    box(8, 186, W-16, 18, 'rgba(8,8,20,0.86)', '#68c0f8');
    text(game.msg, 128, 192, '#f8d000', 'center', 8);
    g.globalAlpha = 1;
  }
  if (game.state === 'play' && game.paused){
    box(0,0,W,H,'rgba(0,0,0,0.65)');
    text('PAUSED', 128, 100, '#fcfcfc', 'center', 20);
    text('P TO RESUME', 128, 124, '#68c0f8', 'center', 8);
  }
  if (game.flash > 0){
    g.globalAlpha = game.flash / 12;
    g.fillStyle = '#ffffff'; g.fillRect(0,0,W,H);
    g.globalAlpha = 1;
  }
  if (!audio.on){ text('MUTED', W-4, H-10, '#8c98c8', 'right', 7); }
}

const STEP = 1000/60;
let last = 0, acc = 0;
function frame(t){
  requestAnimationFrame(frame);
  if (!last) last = t;
  acc += Math.min(t - last, 120); last = t;
  let guard = 0;
  while (acc >= STEP && guard++ < 5){ update(); clearPressed(); acc -= STEP; }
  render();
}
requestAnimationFrame(frame);
</script>
